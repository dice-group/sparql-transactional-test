[package]
name = "sparql-transactional-test"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.19"
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "query"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
clap = { version = "4.6.4", features = ["derive", "string"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
prettydiff = { version = "0.9.0", default-features = false }
rand = "0.10.2"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
